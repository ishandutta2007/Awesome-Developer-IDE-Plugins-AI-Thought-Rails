<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="rail-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <style>
      .glow-orb {
        animation: float 6s ease-in-out infinite alternate;
      }
      .thought-pulse-1 {
        animation: pulseRail 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .thought-pulse-2 {
        animation: pulseRail 4s cubic-bezier(0.4, 0, 0.6, 1) infinite 2s;
      }
      .pill-float {
        animation: floatPill 5s ease-in-out infinite alternate;
      }
      .pill-float-reverse {
        animation: floatPill 5s ease-in-out infinite alternate-reverse;
      }
      .badge-glow {
        animation: borderPulse 3s ease-in-out infinite;
      }

      @keyframes float {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(25px, -15px) scale(1.08); }
      }
      @keyframes floatPill {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-7px); }
      }
      @keyframes pulseRail {
        0% { stroke-dashoffset: 600; opacity: 0.2; }
        50% { opacity: 0.95; }
        100% { stroke-dashoffset: -600; opacity: 0.2; }
      }
      @keyframes borderPulse {
        0%, 100% { stroke: #38bdf8; stroke-opacity: 0.4; }
        50% { stroke: #a855f7; stroke-opacity: 0.9; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="360" fill="url(#grid)" rx="16" />

  <!-- Dynamic Ambient Orbs (Background layer) -->
  <circle cx="200" cy="80" r="120" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="glow-orb" />
  <circle cx="1020" cy="270" r="140" fill="#a855f7" opacity="0.12" filter="url(#glow)" class="glow-orb" style="animation-delay: -3s;" />
  <circle cx="600" cy="180" r="90" fill="#6366f1" opacity="0.08" filter="url(#glow)" />

  <!-- Animated Thought Rails (Neural Guidance Tracks) -->
  <g opacity="0.75">
    <path d="M 50,110 Q 300,50 600,110 T 1150,110" fill="none" stroke="#1e293b" stroke-width="2" />
    <path d="M 50,110 Q 300,50 600,110 T 1150,110" fill="none" stroke="url(#primary-glow)" stroke-width="2.5" stroke-dasharray="80 300" class="thought-pulse-1" filter="url(#subtle-glow)" />

    <path d="M 50,260 Q 300,320 600,260 T 1150,260" fill="none" stroke="#1e293b" stroke-width="2" />
    <path d="M 50,260 Q 300,320 600,260 T 1150,260" fill="none" stroke="url(#primary-glow)" stroke-width="2.5" stroke-dasharray="100 280" class="thought-pulse-2" filter="url(#subtle-glow)" />
  </g>

  <!-- Interactive / Decorative IDE Node Anchors -->
  <g>
    <circle cx="220" cy="100" r="4" fill="#38bdf8" filter="url(#subtle-glow)" />
    <circle cx="600" cy="110" r="5" fill="#818cf8" filter="url(#subtle-glow)" />
    <circle cx="980" cy="100" r="4" fill="#c084fc" filter="url(#subtle-glow)" />

    <circle cx="240" cy="270" r="4" fill="#c084fc" filter="url(#subtle-glow)" />
    <circle cx="600" cy="260" r="5" fill="#818cf8" filter="url(#subtle-glow)" />
    <circle cx="960" cy="270" r="4" fill="#38bdf8" filter="url(#subtle-glow)" />
  </g>

  <!-- Foreground Content: Badge, Title, Subtitle, & Feature Pills -->
  <!-- Top Category Chip -->
  <g transform="translate(600, 52)">
    <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" class="badge-glow" stroke-width="1.2" />
    <circle cx="-115" cy="0" r="4" fill="#10b981" />
    <text x="5" y="4.5" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.5" text-anchor="middle">
      CURATED AWESOME ECOSYSTEM
    </text>
  </g>

  <!-- Main Title -->
  <text x="600" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-weight="800" font-size="36" fill="#f8fafc" letter-spacing="-0.5">
    Developer IDE Plugins &amp; AI Thought Rails
  </text>

  <!-- Gradient Sub-Bar / Underline -->
  <rect x="470" y="142" width="260" height="3" rx="1.5" fill="url(#primary-glow)" />

  <!-- Subtitle / Tagline -->
  <text x="600" y="176" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="15.5" fill="#94a3b8" letter-spacing="0.2">
    Next-Gen AI Autocomplete • Reasoning Step Visualizers • Autonomous Coding Agents • Local LLMs
  </text>

  <!-- Editor & Capability Pills (Foreground Cards) -->
  <g transform="translate(0, 20)">
    <!-- Pill 1: VS Code / JetBrains / Neovim -->
    <g class="pill-float" transform="translate(195, 235)">
      <rect x="0" y="0" width="185" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
      <text x="92.5" y="22.5" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">
        💻 VS Code &amp; JetBrains
      </text>
    </g>

    <!-- Pill 2: Thought-Rail Reasoning -->
    <g class="pill-float-reverse" transform="translate(405, 235)">
      <rect x="0" y="0" width="185" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#4f46e5" stroke-width="1" />
      <text x="92.5" y="22.5" text-anchor="middle" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">
        🧠 AI Thought-Rails
      </text>
    </g>

    <!-- Pill 3: Autonomous Agents -->
    <g class="pill-float" transform="translate(615, 235)">
      <rect x="0" y="0" width="185" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#0284c7" stroke-width="1" />
      <text x="92.5" y="22.5" text-anchor="middle" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">
        ⚡ Autonomous Agents
      </text>
    </g>

    <!-- Pill 4: Local LLMs & Privacy -->
    <g class="pill-float-reverse" transform="translate(825, 235)">
      <rect x="0" y="0" width="180" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
      <text x="90" y="22.5" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">
        🔒 100% Local &amp; Private
      </text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#primary-glow)" rx="2" />
</svg>
